name: CI

on:
  push:
    branches: [main, anas-working, nitin-working]
  pull_request:
    branches: [main, anas-working, nitin-working]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source code
        run: npm run lint

      - name: Check Design System 2.0 compliance
        run: npm run lint:design

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
